name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so only the latest push is validated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · unit · search eval · build · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit invariants for the search engine — the rules a retuned edge must
      # never break (garment-subject exclusion, denim≠jeans, catalog fuzzy off).
      - name: Unit tests
        run: npm run test:unit

      # Deterministic search-relevance gate. Fails the build if the concept-graph
      # ranker drops below the labelled precision@k / pass-rate thresholds.
      - name: Search evaluation
        run: npm run test:search

      - name: Production build
        run: npm run build

      # Deterministic HTTP smoke against a production server the script boots on
      # port 3111 itself: home/search render real catalog results, the /out guard
      # (200 valid / 404 unknown, no external redirect), and the analytics
      # same-origin security contract (202 same-origin, 403 cross-origin / missing
      # origin / spoofed forwarded headers, 404 unknown, 413 oversized). Node-only,
      # no browser — closes the "green PR but broken frontend/backend boundary" gap
      # without importing Playwright flakiness. (Leaves APP_CANONICAL_ORIGIN unset,
      # so isSameOrigin falls back to the request host and same-origin stays 202.)
      - name: Integration smoke
        run: npm run test:integration
