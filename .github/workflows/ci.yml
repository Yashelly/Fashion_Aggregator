name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so only the latest push is validated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · search eval · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Deterministic search-relevance gate. Fails the build if the concept-graph
      # ranker drops below the labelled precision@k / pass-rate thresholds.
      - name: Search evaluation
        run: npm run test:search

      - name: Production build
        run: npm run build
